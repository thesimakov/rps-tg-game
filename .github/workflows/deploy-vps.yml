# Продакшен для Telegram: https://tg.lemnity.ru/ (после push в main + секреты VPS_*).
name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install

      - name: Build app
        env:
          NODE_ENV: production
        run: npm run build

      # Ключ в файл + strip CR (устраняет libcrypto при передаче ключа в stdin Docker-actions).
      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > "${GITHUB_WORKSPACE}/.ssh_deploy_key"
          chmod 600 "${GITHUB_WORKSPACE}/.ssh_deploy_key"
          if [ ! -s "${GITHUB_WORKSPACE}/.ssh_deploy_key" ]; then echo "::error::Секрет VPS_SSH_KEY пустой"; exit 1; fi
          if ! ssh-keygen -y -f "${GITHUB_WORKSPACE}/.ssh_deploy_key" >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY не читается как приватный ключ. Вставьте целиком файл BEGIN…END (не .pub и не SHA256:…)."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Rsync to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ${GITHUB_WORKSPACE}/.ssh_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            --exclude '.git' --exclude 'node_modules' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/rps-tg-game/

      - name: Restart app on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "${GITHUB_WORKSPACE}/.ssh_deploy_key" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s <<'ENDSSH'
          set -e
          cd /opt/rps-tg-game
          npm install --production=false
          pm2 restart rps-tg-game || pm2 start npm --name rps-tg-game -- start
          pm2 save
          ENDSSH

